model_list:
  # Ver Change-RAG-SRD-e-Desktop, Fase 4: llama3.2 (3B) tinha taxa de
  # rejeição do Guardrail de Saída de 40%+ mesmo depois do fix de prompt
  # (Frente 1, Tarefas-Pendentes) — teto de qualidade do modelo, não bug de
  # código. llama3 (8B, já baixado localmente) validado como upgrade real.
  #
  # IMPORTANTE: `ollama_chat/`, não `ollama/`. O prefixo `ollama/` (sem
  # "_chat") usa a API legada /api/generate do Ollama — completion de texto
  # único, sem papéis — e o LiteLLM acha achatando todo o histórico
  # (system+troca anteriores+turno atual) num blob de texto só. Isso
  # confundia o modelo a tratar a conversa como um documento pra "analisar"
  # em vez de responder em personagem (achado real em produção: NPCs
  # pedindo "informação de debug" ao jogador, recitando o histórico
  # inteiro). `ollama_chat/` usa /api/chat de verdade, com mensagens
  # estruturadas por papel — resolve na raiz, não é limite de tamanho de
  # histórico (que já era limitado a 3 trocas, ver db.rs::MAX_TROCAS_MEMORIA).
  - model_name: airpg-local
    litellm_params:
      model: ollama_chat/llama3
      api_base: http://host.docker.internal:11434

  # Pool de IAs gratuitas: mesmo model_name em 3 deployments -> LiteLLM
  # faz load balancing/retry automático entre eles quando um falha ou
  # bate o rate limit do free tier.
  - model_name: airpg-pool-gratis
    litellm_params:
      model: gemini/gemini-2.0-flash-exp
      api_key: os.environ/GEMINI_API_KEY
  - model_name: airpg-pool-gratis
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  - model_name: airpg-pool-gratis
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  # PAGO — cobra por token. Não usar como padrão; só quando o usuário
  # escolher explicitamente na tela de Configurações.
  - model_name: claude-pago
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_UPSTREAM

general_settings:
  master_key: "1234"
  store_model_in_db: true
  store_prompts_in_spend_logs: true
