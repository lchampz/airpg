model_list:
  # Ver Change-RAG-SRD-e-Desktop, Fase 4 — llama3.2 (3B) trocado por llama3
  # (8B) depois de validação real de qualidade (menor taxa de rejeição do
  # Guardrail de Saída, ver o Change no vault pros números).
  #
  # `ollama_chat/`, não `ollama/` — o prefixo sem "_chat" usa a API legada
  # /api/generate (completion de texto único, sem papéis), fazendo o LiteLLM
  # achatar system+histórico+turno atual num blob de texto só. Isso
  # confundia o modelo a "debugar"/recitar a conversa em vez de narrar em
  # personagem (achado real em produção). `ollama_chat/` usa /api/chat de
  # verdade, com mensagens estruturadas por papel.
  - model_name: airpg-local
    litellm_params:
      model: ollama_chat/llama3
      api_base: http://localhost:11434

general_settings:
  master_key: sk-airpg-local-dev
