model_list:
  # Ver Change-RAG-SRD-e-Desktop, Fase 4 — llama3.2 (3B) trocado por llama3
  # (8B) depois de validação real de qualidade (menor taxa de rejeição do
  # Guardrail de Saída, ver o Change no vault pros números).
  #
  # `ollama_chat/`, não `ollama/` — o prefixo sem "_chat" usa a API legada
  # /api/generate (completion de texto único, sem papéis), fazendo o LiteLLM
  # achatar system+histórico+turno atual num blob de texto só. Isso
  # confundia o modelo a "debugar"/recitar a conversa em vez de narrar em
  # personagem (achado real em produção). `ollama_chat/` usa /api/chat de
  # verdade, com mensagens estruturadas por papel.
  - model_name: airpg-local
    litellm_params:
      model: ollama_chat/llama3
      api_base: http://localhost:11434

  # Pool de IAs gratuitas: mesmo model_name em 3 deployments -> LiteLLM
  # faz load balancing/retry automático entre eles quando um falha ou
  # bate o rate limit do free tier.
  - model_name: airpg-pool-gratis
    litellm_params:
      model: gemini/gemini-2.0-flash-exp
      api_key: os.environ/GEMINI_API_KEY
  - model_name: airpg-pool-gratis
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  - model_name: airpg-pool-gratis
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  # PAGO — cobra por token. Não usar como padrão; só quando o usuário
  # escolher explicitamente na tela de Configurações.
  - model_name: claude-pago
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_UPSTREAM

general_settings:
  master_key: sk-airpg-local-dev
